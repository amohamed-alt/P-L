name: Deploy P&L Dashboard to VPS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pnl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check server syntax
        run: npm run check

      - name: Run smoke test
        run: npm run smoke

      - name: Validate Docker image
        run: docker build --tag pnl-dashboard:${{ github.sha }} .

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pnl.dashboardtalentera.tech
    steps:
      - name: Configure SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy production stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          VPS_USER="${VPS_USER:-root}"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          REPO_DIR=/root/P-L
          RUNTIME_DIR=/root/P-L-runtime/data
          REPO_URL=https://github.com/amohamed-alt/P-L.git

          if [ ! -d "$REPO_DIR/.git" ]; then
            rm -rf "$REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          install -d -m 0770 -o 1001 -g 1001 "$RUNTIME_DIR"
          test -f "$REPO_DIR/.env" || {
            echo "Missing /root/P-L/.env. Run the one-time P&L bootstrap first."
            exit 1
          }
          grep -Eq '^PNL_DATA_INGEST_TOKEN=.{32,}$' "$REPO_DIR/.env" || {
            echo "PNL_DATA_INGEST_TOKEN is missing or invalid."
            exit 1
          }

          docker network inspect n8n_default >/dev/null 2>&1 || {
            echo "Required Traefik network n8n_default does not exist."
            exit 1
          }

          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps

          PORT=$(awk -F= '/^PNL_HOST_PORT=/{print $2}' .env | tail -1)
          PORT=${PORT:-3020}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "P&L dashboard deployment is healthy."
              exit 0
            fi
            sleep 2
          done

          docker compose logs --tail=150 pnl-dashboard
          exit 1
          REMOTE
