name: Inspect P&L TLS Certificate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-tls:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and inspect certificate
        run: |
          set -euo pipefail
          getent ahostsv4 pnl.dashboardtalentera.tech | head -3
          echo | openssl s_client -connect pnl.dashboardtalentera.tech:443 -servername pnl.dashboardtalentera.tech -showcerts 2>/tmp/s_client.log | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          cat /tmp/s_client.log | tail -20
          curl --fail --silent --show-error --location --max-time 20 https://pnl.dashboardtalentera.tech/api/health >/dev/null
          echo "HTTPS certificate is trusted by the GitHub runner."
