name: Temporary Security Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS TLS and logo source
        run: |
          set -euo pipefail
          echo '=== DNS A ==='
          dig +short A pnl.dashboardtalentera.tech @1.1.1.1 || true
          dig +short A pnl.dashboardtalentera.tech @8.8.8.8 || true
          echo '=== DNS AAAA ==='
          dig +short AAAA pnl.dashboardtalentera.tech @1.1.1.1 || true
          dig +short AAAA pnl.dashboardtalentera.tech @8.8.8.8 || true
          echo '=== TLS ==='
          echo | openssl s_client -connect pnl.dashboardtalentera.tech:443 -servername pnl.dashboardtalentera.tech -showcerts 2>/tmp/tls.log | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          tail -30 /tmp/tls.log
          echo '=== HTTPS HEADERS ==='
          curl --fail --silent --show-error --head --max-time 20 https://pnl.dashboardtalentera.tech/
          echo '=== LOGO DOWNLOAD ==='
          curl --fail --silent --show-error --location --max-time 30 'https://talimg1.b8cdn.com/wp-content/themes/talentera-2018/images/new-design/Talentera-ATS-white-logo.svg' -o /tmp/talentera-logo.svg
          test -s /tmp/talentera-logo.svg
          echo "logo_bytes=$(wc -c </tmp/talentera-logo.svg)"
          echo 'LOGO_BASE64_START'
          base64 -w1000 /tmp/talentera-logo.svg
          echo 'LOGO_BASE64_END'
