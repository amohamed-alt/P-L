name: Diagnose P&L Routing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Check VPS routing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "root@$VPS_HOST" '
            echo "container_health=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3020/api/health || true)";
            echo "port_443_listening=$(ss -ltn | awk "\$4 ~ /:443$/ {found=1} END {print found ? \"yes\" : \"no\"}")";
            echo "traefik_https=$(curl -k -sS -o /dev/null -w "%{http_code}" --resolve pnl.dashboardtalentera.tech:443:127.0.0.1 https://pnl.dashboardtalentera.tech/api/health || true)";
            echo "pnl_networks=$(docker inspect pnl-dashboard-pnl-dashboard-1 --format "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" 2>/dev/null || echo unknown)";
            docker ps --filter name=pnl-dashboard --format "container={{.Names}} status={{.Status}}";
          '

      - name: Check public DNS
        run: |
          set -euo pipefail
          if getent ahostsv4 pnl.dashboardtalentera.tech | head -1; then
            echo "dns=resolved"
          else
            echo "dns=missing"
          fi
          code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve pnl.dashboardtalentera.tech:443:187.77.2.175 https://pnl.dashboardtalentera.tech/api/health || true)"
          echo "public_ip_https=${code:-unreachable}"
