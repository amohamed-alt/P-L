name: Verify P&L VPS Access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required GitHub secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          [[ "$VPS_HOST" != *"://"* ]] || { echo "VPS_HOST must not contain http:// or https://"; exit 1; }
          [[ "$VPS_HOST" != *"@"* ]] || { echo "VPS_HOST must contain only the host, without root@"; exit 1; }
          [[ "$VPS_HOST" != *":"* ]] || { echo "VPS_HOST must not include a port; use the host only."; exit 1; }
          test "$VPS_HOST" = "187.77.2.175"
          echo "Required SSH secrets are configured."

      - name: Verify SSH port is reachable
        run: |
          set -euo pipefail
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/187.77.2.175/22'
          echo "VPS SSH port 22 is reachable."

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify root SSH and VPS prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "root@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          command -v git >/dev/null
          command -v docker >/dev/null
          docker compose version >/dev/null
          docker network inspect n8n_default >/dev/null
          test -f /root/P-L/.env
          grep -Eq '^PNL_DATA_INGEST_TOKEN=.{32,}$' /root/P-L/.env
          echo "VPS connectivity and P&L prerequisites are ready."
          REMOTE

# Verification rerun requested after authorized_keys update.
