name: Verify P&L VPS Access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = "187.77.2.175"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Report VPS status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "root@$VPS_HOST" 'failed=0; command -v git >/dev/null && echo git=ok || { echo git=missing; failed=1; }; command -v docker >/dev/null && echo docker=ok || { echo docker=missing; failed=1; }; docker compose version >/dev/null 2>&1 && echo compose=ok || { echo compose=missing; failed=1; }; docker network inspect n8n_default >/dev/null 2>&1 && echo network=ok || { echo network=missing; failed=1; }; [ -f /root/P-L/.env ] && echo env=ok || { echo env=missing; failed=1; }; grep -Eq "^PNL_DATA_INGEST_TOKEN=.{32,}$" /root/P-L/.env 2>/dev/null && echo token=ok || { echo token=missing; failed=1; }; exit $failed'
