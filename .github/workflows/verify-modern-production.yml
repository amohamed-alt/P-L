name: Verify Modern P&L Public Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Verify modern React dashboard and security
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 -D "$headers" https://pnl.dashboardtalentera.tech/api/health -o "$body"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(p.version!==2)throw new Error('Expected version 2');console.log('public_api_version=2');console.log('data_source='+p.data.source);console.log('monthly_records='+p.data.monthlyRecords)" "$body"
          grep -qi '^strict-transport-security:' "$headers"
          echo "hsts=enabled"
          curl --fail --silent --show-error --max-time 20 https://pnl.dashboardtalentera.tech/ | grep -q 'Tech Licensing — P&L Command Center'
          echo "react_shell=live"
          echo | openssl s_client -connect pnl.dashboardtalentera.tech:443 -servername pnl.dashboardtalentera.tech 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          redirect_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 http://pnl.dashboardtalentera.tech/api/health)"
          echo "http_redirect_status=$redirect_code"
          test "$redirect_code" = "301" -o "$redirect_code" = "308"
          echo "Modern React P&L production verification passed."
